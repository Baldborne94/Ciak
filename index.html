<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ciak.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ciak" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta
      name="description"
      content="Ciak — il tuo compagno personale di cinema: traccia film, serie TV, anime e cartoni con ricerca avanzata, watchlist e raccomandazioni AI."
    />
    <!-- Ogni schermata carica dati e locandine da TMDB: aprire la connessione
         subito evita di pagare DNS + TLS al primo poster, che su rete mobile
         sono qualche decimo di secondo prima ancora di chiedere l'immagine. -->
    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <title>Ciak 🎬</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
