name: Immagine per il NAS

# L'immagine Docker di Ciak (vedi nas/LEGGIMI.md): a ogni modifica su main la
# costruisce e la pubblica su ghcr.io, e il NAS la scarica da solo (il
# container «aggiorna»). Su una pull request la costruisce soltanto: un
# Dockerfile rotto si scopre lì, non sul NAS.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - server/**
      - package.json
      - package-lock.json
      - vite.config.ts
      - .github/workflows/immagine.yml

permissions:
  contents: read
  packages: write

jobs:
  immagine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Accesso a ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Il nome su ghcr.io va in minuscolo, anche se l'utente GitHub non lo è.
      - name: Costruzione (e pubblicazione da main)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          build-args: VERSIONE_APP=${{ github.sha }}
          tags: |
            ghcr.io/baldborne94/ciak:latest
            ghcr.io/baldborne94/ciak:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
