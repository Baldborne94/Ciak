name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # Il container ufficiale di Playwright ha già Chromium e tutte le sue
    # dipendenze di sistema: niente apt a ogni giro. `install --with-deps`
    # scaricava i caratteri dai server di Ubuntu, e quando il runner non li
    # risolveva (novembre 2026, due giri di fila) l'E2E cadeva prima di un
    # solo test. La versione deve essere quella di @playwright/test nel
    # package-lock.json (lo controlla src/lib/ciPlaywright.test.ts).
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # I test E2E sono ermetici: TMDB e Supabase sono intercettati da
      # Playwright, quindi non servono chiavi reali né segreti del repo.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
