<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="10" fill="#0a0a0f" />
  <!-- Clapperboard base -->
  <rect x="10" y="30" width="44" height="22" rx="3" fill="#1c1c26" stroke="#e8b923" stroke-width="1.5" />
  <!-- Clapper top -->
  <g transform="rotate(-12 12 28)">
    <rect x="10" y="20" width="44" height="10" rx="2" fill="#121218" stroke="#e8b923" stroke-width="1.5" />
    <polygon points="14,20 20,30 26,20 32,30 38,20 44,30 50,20 56,30 56,20" fill="#e8b923" opacity="0.85" />
  </g>
  <!-- Reel hole -->
  <circle cx="32" cy="42" r="4" fill="#9b1c1c" />
</svg>
